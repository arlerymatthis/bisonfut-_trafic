name: Collecte Bison Futé (débits 6 min)

on:
  schedule:
    - cron: "*/6 * * * *"   # toutes les 6 minutes (UTC) - GitHub peut retarder ou sauter des exécutions
  workflow_dispatch:
    inputs:
      inspect:
        description: "Afficher la structure réelle des fichiers au lieu de collecter"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collecte-bisonfute
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Inspection (manuel)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect }}
        run: python scripts/extract_bisonfute.py --inspect

      - name: Collecte
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.inspect) }}
        run: python scripts/extract_bisonfute.py

      - name: Commit des données
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.inspect) }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "collecte $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git pull --rebase
            git push
          fi
